<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outreach Agent</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #667085;
      --line: #d9dee7;
      --accent: #176b87;
      --accent-strong: #0f4f64;
      --warn: #a15c00;
      --bad: #a83232;
      --good: #23734d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    h1 { margin: 0; font-size: 20px; font-weight: 650; }
    h2 { margin: 0 0 12px; font-size: 15px; font-weight: 650; }
    main { max-width: 1400px; margin: 0 auto; padding: 20px 24px 40px; }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .grid { display: grid; gap: 12px; }
    .grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
    .inline { display: flex; gap: 8px; align-items: center; color: var(--text); }
    label { display: grid; gap: 5px; color: var(--muted); font-size: 12px; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 10px;
      color: var(--text);
      background: #fff;
      font: inherit;
    }
    textarea { min-height: 72px; resize: vertical; }
    button {
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      padding: 9px 12px;
      font: inherit;
      cursor: pointer;
      min-height: 36px;
    }
    button.secondary { background: #fff; color: var(--accent); }
    button.warn { background: var(--warn); border-color: var(--warn); }
    button.bad { background: var(--bad); border-color: var(--bad); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 9px 8px;
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }
    th { color: var(--muted); font-size: 12px; font-weight: 600; }
    tr:last-child td { border-bottom: 0; }
    .stats { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
    .stat {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px;
      min-height: 64px;
      background: #fbfcfd;
    }
    .stat span { display: block; color: var(--muted); font-size: 12px; }
    .stat strong { display: block; margin-top: 4px; font-size: 20px; }
    .status { color: var(--muted); }
    .status.sent, .status.approved, .status.passed { color: var(--good); }
    .status.failed, .status.rejected { color: var(--bad); }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .message { min-height: 20px; color: var(--muted); }
    @media (max-width: 900px) {
      header { position: static; align-items: flex-start; flex-direction: column; }
      .grid.cols-2, .grid.cols-4, .stats { grid-template-columns: 1fr; }
      main { padding: 14px; }
      section { padding: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Outreach Agent</h1>
    <div class="toolbar">
      <label>Campaign
        <select id="campaignSelect"></select>
      </label>
      <button class="secondary" id="refreshBtn">Refresh</button>
      <button class="secondary" id="discoverBtn">Discover</button>
      <button class="secondary" id="exportBtn">Export CSV</button>
    </div>
  </header>

  <main>
    <section>
      <h2>New Campaign</h2>
      <form id="campaignForm" class="grid cols-4">
        <label>Niche <input name="niche" required placeholder="restaurants"></label>
        <label>Location <input name="location" required placeholder="Paris, France"></label>
        <label>Target <input name="target_count" type="number" min="1" max="500" value="10"></label>
        <label>Daily Limit <input name="daily_send_limit" type="number" min="1" max="200" value="25"></label>
        <label>Language <input name="language" value="en"></label>
        <label class="inline"><input name="approval_required" type="checkbox" checked style="width:auto;"> Approval required</label>
        <label style="grid-column: 1 / -1;">Offer <input name="offer" placeholder="explainer video service"></label>
        <div><button type="submit">Create</button></div>
      </form>
    </section>

    <section>
      <h2>Summary</h2>
      <div id="summary" class="stats"></div>
    </section>

    <section>
      <h2>Add Lead</h2>
      <form id="leadForm" class="grid cols-2">
        <label>Business <input name="business_name" required></label>
        <label>Website <input name="website_url" required placeholder="https://example.com"></label>
        <label>Email <input name="email" placeholder="hello@example.com"></label>
        <label>Contact Page <input name="contact_page_url" placeholder="https://example.com/contact"></label>
        <label style="grid-column: 1 / -1;">Description <textarea name="description"></textarea></label>
        <div><button type="submit">Add Lead</button></div>
      </form>
    </section>

    <section>
      <h2>Leads</h2>
      <div style="overflow:auto;">
        <table>
          <thead>
            <tr>
              <th style="width:18%;">Business</th>
              <th style="width:18%;">Email</th>
              <th style="width:10%;">Score</th>
              <th style="width:12%;">Status</th>
              <th>Description</th>
              <th style="width:18%;">Actions</th>
            </tr>
          </thead>
          <tbody id="leadsBody"></tbody>
        </table>
      </div>
    </section>

    <section>
      <h2>Drafts</h2>
      <div style="overflow:auto;">
        <table>
          <thead>
            <tr>
              <th style="width:16%;">Business</th>
              <th style="width:20%;">Subject</th>
              <th>Body</th>
              <th style="width:14%;">Status</th>
              <th style="width:22%;">Actions</th>
            </tr>
          </thead>
          <tbody id="draftsBody"></tbody>
        </table>
      </div>
    </section>

    <section>
      <h2>Replies</h2>
      <div id="replyCounts" class="toolbar" style="margin-bottom:10px;"></div>
      <div style="overflow:auto;">
        <table>
          <thead>
            <tr>
              <th style="width:18%;">Business</th>
              <th style="width:15%;">Intent</th>
              <th style="width:18%;">From</th>
              <th>Reply</th>
              <th style="width:16%;">Received</th>
            </tr>
          </thead>
          <tbody id="repliesBody"></tbody>
        </table>
      </div>
    </section>

    <section>
      <h2>Suppression</h2>
      <form id="suppressionForm" class="toolbar">
        <label>Email <input name="email" placeholder="person@example.com"></label>
        <label>Domain <input name="domain" placeholder="example.com"></label>
        <label>Reason <input name="reason" value="manual"></label>
        <button type="submit">Add</button>
      </form>
      <div id="suppressionList" style="margin-top:12px;"></div>
    </section>

    <div id="message" class="message"></div>
  </main>

  <script>
    const state = { campaigns: [], campaignId: null };
    const $ = (id) => document.getElementById(id);
    let lastJobId = null;

    async function api(path, options = {}) {
      const response = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        ...options
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || data.stderr || JSON.stringify(data));
      return data;
    }

    function formData(form) {
      return Object.fromEntries(new FormData(form).entries());
    }

    function setMessage(text) {
      $("message").textContent = text || "";
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function currentCampaignId() {
      return Number($("campaignSelect").value || state.campaignId || 0);
    }

    async function loadCampaigns() {
      const data = await api("/api/campaigns");
      state.campaigns = data.campaigns || [];
      const select = $("campaignSelect");
      select.innerHTML = "";
      for (const campaign of state.campaigns) {
        const option = document.createElement("option");
        option.value = campaign.id;
        option.textContent = `#${campaign.id} ${campaign.niche} in ${campaign.location}`;
        select.appendChild(option);
      }
      if (state.campaigns.length) {
        state.campaignId = Number(select.value || state.campaigns[0].id);
      }
    }

    async function loadSummary() {
      const id = currentCampaignId();
      const summary = $("summary");
      summary.innerHTML = "";
      if (!id) return;
      const data = await api(`/api/campaigns/${id}/summary`);
      const labels = [
        ["Businesses", "businesses_found"],
        ["Emails", "emails_extracted"],
        ["Forms", "contact_form_only"],
        ["Approved", "approved_drafts"],
        ["Sent", "emails_sent"],
        ["Failures", "failures"],
        ["Replies", "replies"],
        ["Opt-outs", "opt_outs"]
      ];
      for (const [label, key] of labels) {
        const item = document.createElement("div");
        item.className = "stat";
        item.innerHTML = `<span>${label}</span><strong>${data.summary[key] || 0}</strong>`;
        summary.appendChild(item);
      }
    }

    async function loadLeads() {
      const id = currentCampaignId();
      const body = $("leadsBody");
      body.innerHTML = "";
      if (!id) return;
      const data = await api(`/api/campaigns/${id}/leads`);
      for (const lead of data.leads || []) {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td><a href="${lead.website_url}" target="_blank" rel="noreferrer">${lead.business_name || "Unknown"}</a></td>
          <td>${lead.email || ""}</td>
          <td>${lead.fit_score || 0}</td>
          <td class="status ${lead.status}">${lead.status || ""}</td>
          <td>${lead.description || ""}</td>
          <td class="actions">
            <button class="secondary" data-action="score" data-id="${lead.id}">Score</button>
            <button class="secondary" data-action="draft" data-id="${lead.id}">Draft</button>
          </td>`;
        body.appendChild(row);
      }
    }

    async function loadDrafts() {
      const id = currentCampaignId();
      const body = $("draftsBody");
      body.innerHTML = "";
      if (!id) return;
      const data = await api(`/api/campaigns/${id}/drafts`);
      for (const draft of data.drafts || []) {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${draft.business_name || "Unknown"}</td>
          <td><input data-field="subject" data-id="${draft.id}" value="${escapeHtml(draft.subject)}"></td>
          <td><textarea data-field="body" data-id="${draft.id}">${escapeHtml(draft.body)}</textarea></td>
          <td><span class="status ${draft.status}">${draft.status}</span><br><span class="status ${draft.compliance_status}">${draft.compliance_status}</span></td>
          <td class="actions">
            <button class="secondary" data-action="save" data-id="${draft.id}">Save</button>
            <button class="secondary" data-action="approve" data-id="${draft.id}">Approve</button>
            <button class="bad" data-action="reject" data-id="${draft.id}">Reject</button>
            <button class="warn" data-action="sendcheck" data-id="${draft.id}">Dry Run</button>
          </td>`;
        body.appendChild(row);
      }
    }

    async function loadReplies() {
      const id = currentCampaignId();
      const body = $("repliesBody");
      const counts = $("replyCounts");
      body.innerHTML = "";
      counts.innerHTML = "";
      if (!id) return;
      const data = await api(`/api/campaigns/${id}/replies`);
      for (const item of data.intent_counts || []) {
        const badge = document.createElement("span");
        badge.textContent = `${item.intent}: ${item.n}`;
        counts.appendChild(badge);
      }
      for (const reply of data.replies || []) {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${escapeHtml(reply.business_name || "Unknown")}</td>
          <td class="status ${reply.intent}">${escapeHtml(reply.intent || "unknown")}</td>
          <td>${escapeHtml(reply.from_email || "")}</td>
          <td>${escapeHtml(reply.snippet || reply.raw_reply_text || "")}</td>
          <td>${escapeHtml(reply.received_at || reply.created_at || "")}</td>`;
        body.appendChild(row);
      }
    }

    async function loadSuppression() {
      const data = await api("/api/suppression?limit=20");
      $("suppressionList").innerHTML = (data.suppression || [])
        .map(item => `<div>${item.email || item.domain} | ${item.reason || ""} | ${item.source || ""}</div>`)
        .join("");
    }

    async function refresh() {
      try {
        await loadCampaigns();
        await Promise.all([loadSummary(), loadLeads(), loadDrafts(), loadSuppression(), loadReplies()]);
      } catch (error) {
        setMessage(error.message);
      }
    }

    $("campaignForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = formData(event.currentTarget);
      data.target_count = Number(data.target_count || 10);
      data.daily_send_limit = Number(data.daily_send_limit || 25);
      data.language = data.language || "en";
      data.approval_required = event.currentTarget.elements.approval_required.checked;
      try {
        const result = await api("/api/campaigns", { method: "POST", body: JSON.stringify(data) });
        setMessage(`Campaign #${result.campaign_id} created`);
        await refresh();
        $("campaignSelect").value = result.campaign_id;
        await Promise.all([loadSummary(), loadLeads(), loadDrafts(), loadReplies()]);
      } catch (error) {
        setMessage(error.message);
      }
    });

    $("leadForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const id = currentCampaignId();
      if (!id) return;
      try {
        const result = await api(`/api/campaigns/${id}/leads`, {
          method: "POST",
          body: JSON.stringify(formData(event.currentTarget))
        });
        setMessage(`Lead #${result.lead_id} added`);
        event.currentTarget.reset();
        await Promise.all([loadSummary(), loadLeads()]);
      } catch (error) {
        setMessage(error.message);
      }
    });

    $("leadsBody").addEventListener("click", async (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      const id = Number(button.dataset.id);
      const action = button.dataset.action;
      try {
        if (action === "score") await api(`/api/leads/${id}/score`, { method: "POST", body: "{}" });
        if (action === "draft") await api(`/api/leads/${id}/drafts`, { method: "POST", body: "{}" });
        setMessage(`${action} complete`);
        await Promise.all([loadSummary(), loadLeads(), loadDrafts()]);
      } catch (error) {
        setMessage(error.message);
      }
    });

    $("draftsBody").addEventListener("click", async (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      const id = Number(button.dataset.id);
      const action = button.dataset.action;
      try {
        if (action === "save") {
          const subject = document.querySelector(`input[data-field="subject"][data-id="${id}"]`).value;
          const body = document.querySelector(`textarea[data-field="body"][data-id="${id}"]`).value;
          await api(`/api/drafts/${id}`, { method: "POST", body: JSON.stringify({ subject, body }) });
        }
        if (action === "approve") await api(`/api/drafts/${id}/approve`, { method: "POST", body: "{}" });
        if (action === "reject") await api(`/api/drafts/${id}/reject`, { method: "POST", body: JSON.stringify({ reason: "Rejected in dashboard" }) });
        if (action === "sendcheck") {
          const result = await api(`/api/drafts/${id}/send`, { method: "POST", body: JSON.stringify({ dry_run: true }) });
          setMessage(result.stdout.trim());
        } else {
          setMessage(`${action} complete`);
        }
        await Promise.all([loadSummary(), loadLeads(), loadDrafts(), loadReplies()]);
      } catch (error) {
        setMessage(error.message);
      }
    });

    $("suppressionForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        await api("/api/suppression", { method: "POST", body: JSON.stringify(formData(event.currentTarget)) });
        event.currentTarget.reset();
        await loadSuppression();
        setMessage("Suppression added");
      } catch (error) {
        setMessage(error.message);
      }
    });

    $("campaignSelect").addEventListener("change", async () => {
      state.campaignId = currentCampaignId();
      await Promise.all([loadSummary(), loadLeads(), loadDrafts(), loadReplies()]);
    });
    $("refreshBtn").addEventListener("click", refresh);
    $("discoverBtn").addEventListener("click", async () => {
      const id = currentCampaignId();
      if (!id) return;
      try {
        const result = await api(`/api/campaigns/${id}/discover`, { method: "POST", body: "{}" });
        lastJobId = result.job_id;
        setMessage(`Discovery job queued: ${lastJobId}`);
      } catch (error) {
        setMessage(error.message);
      }
    });
    $("exportBtn").addEventListener("click", () => {
      const id = currentCampaignId();
      if (id) window.location.href = `/api/campaigns/${id}/export`;
    });
    setInterval(async () => {
      if (!lastJobId) return;
      try {
        const data = await api(`/api/jobs/${lastJobId}`);
        setMessage(`Discovery ${data.job.status}: ${data.job.saved || 0} saved`);
        if (["completed", "failed"].includes(data.job.status)) {
          lastJobId = null;
          await Promise.all([loadSummary(), loadLeads()]);
        }
      } catch (error) {
        setMessage(error.message);
      }
    }, 3000);
    refresh();
  </script>
</body>
</html>
